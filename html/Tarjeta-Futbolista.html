<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Feliz Día del Futbolista ⚽</title>
<style>
body{
  margin:0;
  background:#000;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  font-family:"Poppins",sans-serif;
  color:#fff;
  overflow-y:auto; /* ✅ permite scroll */
  overflow-x:hidden;
  position:relative;
  padding:40px 0;
}


/* TITULO DESCARGA (para la versión final) */
.titulo-descarga{
  font-size:32px;
  font-weight:900;
  background:linear-gradient(90deg,#ffd700,#fff6a3,#ffdd00);
  -webkit-background-clip:text;
  color:transparent;
  text-shadow:0 0 15px #ffd700,0 0 30px #ffea70;
  animation:brillo 3s infinite ease-in-out;
  text-align:center;
  margin-bottom:25px;
  position:relative;
  z-index:5; /* ✅ lo trae por encima de los fuegos */
}
@keyframes brillo{
  0%,100%{opacity:1;filter:brightness(1);}
  50%{opacity:.7;filter:brightness(1.6);}
}

/* TITULO EDITABLE (antes de descargar) */
h1{
  font-size:28px;
  font-weight:900;
  background:linear-gradient(90deg,#ffd700,#fff8b3,#ffd700);
  -webkit-background-clip:text;
  color:transparent;
  margin-bottom:20px;
  text-shadow:0 0 15px #ffd700;
  z-index:3;
}

/* CANVAS DE FUEGOS */
#fireworks{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:radial-gradient(circle at center,#000 0%,#020202 100%);
}

/* ==== TARJETA ==== */
.card{
  width:280px;
  height:400px;
  border-radius:20px;
  background:linear-gradient(135deg,#d4af37 0%,#f3e5ab 40%,#c8a23d 70%,#a37b2c 100%);
  position:relative;
  box-shadow:0 15px 40px rgba(0,0,0,.6);
  overflow:hidden;
  animation:sway 1.5s ease-in-out infinite alternate;
  margin-bottom:25px;
  z-index:2;
}
@keyframes sway{
  0%{transform:rotateY(-8deg) rotateX(3deg);}
  100%{transform:rotateY(8deg) rotateX(-3deg);}
}

/* textura facetada */
.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(120deg,rgba(255,255,255,.2) 0%,transparent 20%),
    linear-gradient(240deg,rgba(255,255,255,.12) 0%,transparent 25%),
    linear-gradient(45deg,rgba(255,255,255,.1) 0%,transparent 30%);
  mix-blend-mode:overlay;
  z-index:1;
}

/* contenedor interno */
.inner{
  position:absolute;
  inset:0;
  padding:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  z-index:2;
  color:#111;
}

/* rating + posición */
.rating{
  position:absolute;
  top:18px; left:18px;
  font-size:34px; font-weight:900;
}
.pos{
  position:absolute;
  top:56px; left:22px;
  font-size:18px; font-weight:700;
}

/* círculo de foto */
.photo{
  width:190px;
  height:190px;
  border-radius:50%;
  overflow:hidden;
  margin-top:55px;
  box-shadow:0 0 15px rgba(0,0,0,.5);
  border:3px solid rgba(0,0,0,.15);
}
.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* nombre y país */
.name{
  margin-top:8px;
  font-size:27px;
  font-weight:800;
  text-transform:capitalize;
}
.country{
  font-size:15px;
  color:#222;
  margin-bottom:8px;
}

/* stats */
.stats{
  margin-top:auto;
  width:100%;
  display:flex;
  justify-content:space-between;
  text-align:center;
  font-weight:700;
  color:#111;
  padding:0 10px;
}
.stats div{
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:12px;
}
.stats div span{
  font-weight:900;
  font-size:18px;
}

/* brillo */
.shine{
  position:absolute;
  top:0; left:-100%;
  width:60%; height:100%;
  background:linear-gradient(75deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.4) 50%,rgba(255,255,255,0) 100%);
  transform:skewX(-20deg);
  animation:shine 11s infinite;
}
@keyframes shine{
  0%{left:-100%;}
  60%{left:150%;}
  100%{left:150%;}
}

/* === FORMULARIO === */
.formulario{
  display:flex;
  flex-direction:column;
  gap:10px;
  width:280px;
  background:#0b0b0b;
  padding:20px;
  border-radius:15px;
  box-shadow:0 0 20px rgba(255,255,255,.1);
  z-index:2;
  margin-bottom:20px;
}
.formulario label{
  font-size:14px;
  font-weight:600;
}
.formulario input[type=text],
.formulario input[type=file]{
  background:#222;
  color:#fff;
  border:none;
  padding:10px;
  border-radius:8px;
  font-size:14px;
  outline:none;
}
.formulario input[type=file]{
  background:#181818;
}

/* BOTÓN DESCARGA */
button#descargar{
  background:linear-gradient(90deg,#ffd700,#f6e58d);
  border:none;
  padding:12px 20px;
  border-radius:999px;
  color:#000;
  font-weight:800;
  cursor:pointer;
  font-size:15px;
  box-shadow:0 0 15px rgba(255,215,0,.6);
  transition:transform .2s;
  z-index:3;
}
button#descargar:hover{transform:scale(1.05);}
</style>
</head>
<body>

<h1>Feliz Día del Futbolista ⚽</h1>
<canvas id="fireworks"></canvas>

<div class="card" id="tarjeta">
  <div class="shine"></div>
  <div class="inner">
    <div class="rating">82</div>
    <div class="pos">ST</div>

    <div class="photo">
      <img id="fotoJugador" src="https://upload.wikimedia.org/wikipedia/commons/3/3f/Luis_Suarez_2018.jpg" alt="Jugador">
    </div>

    <div class="name" id="nombreJugador">Suárez</div>
    <div class="country" id="paisClub">🇺🇾 Uruguay • Inter Miami</div>

    <div class="stats">
      <div>PAC<span>64</span></div>
      <div>SHO<span>85</span></div>
      <div>PAS<span>78</span></div>
      <div>DRI<span>77</span></div>
      <div>DEF<span>41</span></div>
      <div>PHY<span>75</span></div>
    </div>
  </div>
</div>

<form class="formulario" id="formulario">
  <label>Nombre del jugador:</label>
  <input type="text" id="inputNombre" placeholder="Ej: Messi">
  
  <label>País y club:</label>
  <input type="text" id="inputPais" placeholder="Ej: 🇦🇷 Argentina • Inter Miami">
  
  <label>Subir foto del jugador:</label>
  <input type="file" id="inputFoto" accept="image/*">
</form>

<button id="descargar">💾 Guardar Tarjeta</button>

<script>
/* ---- Edición de datos ---- */
const inputNombre=document.getElementById("inputNombre");
const inputPais=document.getElementById("inputPais");
const inputFoto=document.getElementById("inputFoto");
const nombreJugador=document.getElementById("nombreJugador");
const paisClub=document.getElementById("paisClub");
const fotoJugador=document.getElementById("fotoJugador");

inputNombre.addEventListener("input",()=>nombreJugador.textContent=inputNombre.value||"Jugador");
inputPais.addEventListener("input",()=>paisClub.textContent=inputPais.value||"País • Club");
inputFoto.addEventListener("change",()=>{
  const f=inputFoto.files[0];
  if(f){
    const r=new FileReader();
    r.onload=e=>fotoJugador.src=e.target.result;
    r.readAsDataURL(f);
  }
});

/* ---- Fuegos artificiales ---- */
function iniciarFuegos(){
  const canvas=document.getElementById("fireworks");
  const ctx=canvas.getContext("2d");
  let W,H;
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  window.addEventListener("resize",resize);
  resize();
  let fireworks=[];
  function random(min,max){return Math.random()*(max-min)+min;}
  function Firework(){this.x=random(W*0.2,W*0.8);this.y=H;this.tx=random(W*0.2,W*0.8);this.ty=random(H*0.1,H*0.5);this.history=[];this.done=false;}
  Firework.prototype.update=function(){
    const dx=this.tx-this.x, dy=this.ty-this.y;
    this.x+=dx*0.05; this.y+=dy*0.05;
    this.history.push({x:this.x,y:this.y});
    if(this.history.length>20) this.history.shift();
    if(Math.abs(dx)<10&&Math.abs(dy)<10){this.explode(); this.done=true;}
  }
  Firework.prototype.draw=function(){
    ctx.beginPath();
    for(let p of this.history) ctx.lineTo(p.x,p.y);
    ctx.strokeStyle='rgba(255,220,100,0.8)';
    ctx.stroke();
  }
  Firework.prototype.explode=function(){
    for(let i=0;i<60;i++) fireworks.push(new Particle(this.tx,this.ty));
  }
  function Particle(x,y){
    this.x=x; this.y=y;
    this.vx=random(-3,3); this.vy=random(-3,3);
    this.alpha=1; this.color=`hsl(${random(0,360)},100%,60%)`;
  }
  Particle.prototype.update=function(){
    this.x+=this.vx; this.y+=this.vy; this.vy+=0.05; this.alpha-=0.015;
  }
  Particle.prototype.draw=function(){
    ctx.globalAlpha=this.alpha;
    ctx.fillStyle=this.color;
    ctx.beginPath(); ctx.arc(this.x,this.y,2,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }
  function loop(){
    ctx.fillStyle="rgba(0,0,0,0.15)";
    ctx.fillRect(0,0,W,H);
    if(Math.random()<0.03) fireworks.push(new Firework());
    for(let i=fireworks.length-1;i>=0;i--){
      const f=fireworks[i];
      if(f.update){
        f.update(); f.draw();
        if(f.done) fireworks.splice(i,1);
      }else{
        f.update(); f.draw();
        if(f.alpha<=0) fireworks.splice(i,1);
      }
    }
    requestAnimationFrame(loop);
  }
  loop();
}
iniciarFuegos();

/* ---- Botón de descarga ---- */
document.getElementById("descargar").addEventListener("click",()=>{
  // eliminar formulario, botón y título original
  document.getElementById("formulario").remove();
  document.getElementById("descargar").remove();
  document.querySelector("h1").remove(); // ✅ elimina el título duplicado de arriba

  // Descarga
  const titulo = '<div class="titulo-descarga">🎉 ¡Feliz Día del Futbolista! ⚽</div>';
  const estilo = document.querySelector("style").outerHTML;
  const body = titulo + document.body.innerHTML.replace(
  'overflow-y:auto;',
  'overflow:hidden;justify-content:center;'
);

  const nuevoHTML = `
  <!DOCTYPE html>
  <html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Feliz Día del Futbolista ⚽</title>${estilo}</head>
  <body>${body}
  <script>(${iniciarFuegos.toString()})();<\/script>
  </body></html>`;

  const blob = new Blob([nuevoHTML], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "tarjeta_futbolista.html";
  a.click();
  URL.revokeObjectURL(url);
  location.reload();
});

</script>
</body>
</html>
