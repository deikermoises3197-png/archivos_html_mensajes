<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>💗 Iniciales en Pareja 💞</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cardW: min(92vw, 420px);
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:18px;
    font-family:Poppins,system-ui,Segoe UI,Roboto,Arial,sans-serif;
    background:#0c0c12; color:#fff;
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  h1{font-size:clamp(18px,3.4vw,28px); font-weight:800; letter-spacing:.2px; margin:6px 0 2px}
  .controls{
    display:flex; gap:12px; flex-wrap:wrap; justify-content:center; align-items:center;
    background:#15162a; border:1px solid #262846; border-radius:12px; padding:10px 12px;
  }
  .controls label{opacity:.9}
  .controls input[type="text"]{
    width:2.6em; text-align:center; font-weight:900; font-size:1.2rem; padding:.35em .25em;
    border-radius:10px; border:1px solid #333; background:#0e1024; color:#fff;
  }

  /* ✅ Cambiado: se eliminó grid y se usa columna fija */
  .grid{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:24px;
    width:100%;
  }

  .card{
    position:relative;
    width:100%;
    max-width:var(--cardW);
    margin-inline:auto;
    border-radius:18px;
    overflow:hidden;
    background:#0a0b18;
    box-shadow:0 18px 50px rgba(0,0,0,.55);
    border:1px solid #00aaff;
  }
  .imgwrap{ position:relative; }
  .imgwrap img{ width:100%; display:block }

  .letter{
    position:absolute;
    transform:translate(-50%,-50%);
    font-weight:900;
    font-size:clamp(40px,12vw,50px);
    color:rgba(0,0,0,0.85);
    text-shadow:
      1px 1px 0 rgba(255,255,255,0.5),
      -1px -1px 0 rgba(0,0,0,0.4),
      0 0 3px rgba(0,0,0,0.3);
    -webkit-text-stroke:0.8px rgba(255,255,255,0.3);
    opacity:.95;
    filter:contrast(1.05) brightness(0.95);
  }

  .foot{
    display:flex; justify-content:center; padding:12px;
    background:linear-gradient(180deg,#0a1a40 0%,#0c3b8c 100%);
    gap:10px;
  }
  .btn{
    border:0; border-radius:10px; padding:10px 14px; cursor:pointer; font-weight:700;
    background:#ff007f; color:#fff; box-shadow:0 6px 18px rgba(255,0,127,.25);
  }
  .btn:hover{ background:#e10073 }
</style>
</head>
<body>

<center><h1>💗 Iniciales en Pareja 💗</h1></center>

<div class="controls">
  <label>Ella:
    <input id="L" type="text" maxlength="1" value="A">
  </label>
  <label>El:
    <input id="R" type="text" maxlength="1" value="B">
  </label>
</div>

<div class="grid" id="grid">
  <!-- Tarjetas apiladas verticalmente -->
  <div class="card" data-id="1">
    <div class="imgwrap" id="wrap-1">
      <img crossorigin="anonymous" src="https://corsproxy.io/?https://adfy2.icu/img/Personalizadas/a.png">
      <div class="letter L" id="L-1">A</div>
      <div class="letter R" id="R-1">B</div>
    </div>
    <div class="foot"><button class="btn" data-dl="1">📥 Descargar</button></div>
  </div>

  <div class="card" data-id="2">
    <div class="imgwrap" id="wrap-2">
       <img crossorigin="anonymous" src="https://corsproxy.io/?https://adfy2.icu/img/Personalizadas/b.png">
      <div class="letter L" id="L-2">A</div>
      <div class="letter R" id="R-2">B</div>
    </div>
    <div class="foot"><button class="btn" data-dl="2">📥 Descargar</button></div>
  </div>

  <div class="card" data-id="3">
    <div class="imgwrap" id="wrap-3">
       <img crossorigin="anonymous" src="https://corsproxy.io/?https://adfy2.icu/img/Personalizadas/c.png">
      <div class="letter L" id="L-3">A</div>
      <div class="letter R" id="R-3">B</div>
    </div>
    <div class="foot"><button class="btn" data-dl="3">📥 Descargar</button></div>
  </div>

  <div class="card" data-id="4">
    <div class="imgwrap" id="wrap-4">
       <img crossorigin="anonymous" src="https://corsproxy.io/?https://adfy2.icu/img/Personalizadas/d.png">
      <div class="letter L" id="L-4">A</div>
      <div class="letter R" id="R-4">B</div>
    </div>
    <div class="foot"><button class="btn" data-dl="4">📥 Descargar</button></div>
  </div>

  <div class="card" data-id="5">
    <div class="imgwrap" id="wrap-5">
       <img crossorigin="anonymous" src="https://corsproxy.io/?https://adfy2.icu/img/Personalizadas/e.png">
      <div class="letter L" id="L-5">A</div>
      <div class="letter R" id="R-5">B</div>
    </div>
    <div class="foot"><button class="btn" data-dl="5">📥 Descargar</button></div>
  </div>
</div>

<script>
/* === POSICIONES === */
const POS = {
  "1": {"L":{"x":29.1,"y":36.8,"rot":-5.6,"skx":-18.6,"sky":-0.2,"scale":0.44},"R":{"x":64.6,"y":34.7,"rot":1.5,"skx":-2.8,"sky":-3.2,"scale":0.57}},
  "2": {"R":{"x":41.8,"y":43.4,"rot":1.8,"skx":5.4,"sky":-0.2,"scale":0.49},"L":{"x":71.1,"y":45.9,"rot":0.1,"skx":12.4,"sky":5.2,"scale":0.42}},
  "3": {"L":{"x":31.5,"y":38.5,"rot":-1,"skx":-20,"sky":-1,"scale":0.43},"R":{"x":68.5,"y":31.9,"rot":-0.1,"skx":7.3,"sky":1.5,"scale":0.42}},
  "4": {"L":{"x":32.9,"y":48.2,"rot":0.5,"skx":-3.1,"sky":-6.7,"scale":0.76},"R":{"x":70.9,"y":48,"rot":-3.2,"skx":-3,"sky":2.7,"scale":0.77}},
  "5": {"L":{"x":34.2,"y":41.2,"rot":0.9,"skx":-5.2,"sky":-2,"scale":0.54},"R":{"x":65.6,"y":37.1,"rot":7.5,"skx":8.3,"sky":-6.4,"scale":0.58}}
};

const inL=document.getElementById('L');
const inR=document.getElementById('R');
function setLettersAll(){
  const L=(inL.value||' ').toUpperCase().slice(0,1);
  const R=(inR.value||' ').toUpperCase().slice(0,1);
  for(let i=1;i<=5;i++){
    document.getElementById('L-'+i).textContent=L;
    document.getElementById('R-'+i).textContent=R;
  }
}
inL.addEventListener('input',setLettersAll);
inR.addEventListener('input',setLettersAll);
setLettersAll();

function applyPositions(){
  for(let i=1;i<=5;i++){
    const cfg=POS[i];
    ['L','R'].forEach(side=>{
      const el=document.getElementById(side+'-'+i);
      const c=cfg[side];
      el.style.left=c.x+'%';
      el.style.top=c.y+'%';
      el.style.transform=`translate(-50%,-50%) rotate(${c.rot}deg) skew(${c.skx}deg,${c.sky}deg) scale(${c.scale})`;
    });
  }
}
applyPositions();

/* === DESCARGA === */
function dlCard(id){
  const node=document.querySelector(`.card[data-id="${id}"] .imgwrap`);
  html2canvas(node,{scale:3,useCORS:true,backgroundColor:null}).then(canvas=>{
    const a=document.createElement('a');
    a.download=`pareja_${id}.png`;
    a.href=canvas.toDataURL('image/png');
    a.click();
  });
}
document.querySelectorAll('[data-dl]').forEach(btn=>{
  btn.addEventListener('click',e=>dlCard(e.currentTarget.getAttribute('data-dl')));
});
const s=document.createElement('script');
s.src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
document.body.appendChild(s);
</script>
</body>
</html>
