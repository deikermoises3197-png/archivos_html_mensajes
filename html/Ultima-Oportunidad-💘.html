<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Última oportunidad 💘</title>
<style>
:root{
  --card:#ffffffcc; --txt:#2a2a2a; --muted:#666;
  --yes:#27c16f; --no:#ff4d4f;
  --pink:#ff3b7c;
}
html,body{
  height:100%; margin:0; overflow:hidden;
  font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
  background:#0b0015;
  display:flex; justify-content:center; align-items:center;
  position:relative;
}

/* 🌌 Fondo aurora animado */
#aurora{
  position:fixed; inset:0; z-index:0;
  background:
    radial-gradient(circle at 18% 25%, rgba(255,0,180,0.22), transparent 60%),
    radial-gradient(circle at 78% 70%, rgba(0,200,255,0.20), transparent 60%),
    radial-gradient(circle at 55% 50%, rgba(255,255,255,0.08), transparent 60%);
  background-size:220% 220%;
  animation:aurora 14s ease-in-out infinite alternate;
  filter:blur(14px);
  transform:translateZ(0);
  will-change:background-position;
}
@keyframes aurora{
  0%{background-position:0% 50%;}
  50%{background-position:100% 60%;}
  100%{background-position:55% 0%;}
}

/* 💖 Corazones flotantes */
#bubbles{
  position:fixed; inset:0; z-index:1; overflow:hidden;
}
.heart{
  position:absolute;
  bottom:-160px;
  width:26px; height:26px;
  transform:rotate(-45deg);
  border-radius:6px;
  opacity:.85;
  animation:floatUp linear infinite;
  filter:drop-shadow(0 0 10px rgba(255,255,255,0.45));
  background: currentColor;
  color:#ff6fb1;
}
.heart::before,.heart::after{
  content:"";
  position:absolute;
  width:100%; height:100%;
  border-radius:50%;
  background: currentColor;
}
.heart::before{ top:-50%; left:0; }
.heart::after{ top:0; left:50%; }
@keyframes floatUp{
  0%   { transform:translateY(0) rotate(-45deg) scale(.9); opacity:0; }
  18%  { opacity:1; }
  100% { transform:translateY(-112vh) rotate(-45deg) scale(1.45); opacity:0; }
}

/* 🌈 Borde animado */
.cardWrapper{
  position:relative;
  border-radius:28px; padding:3px;
  background:linear-gradient(120deg,#ff8ad0,#ffd6a5,#a6c1ee,#c3a0ff,#ff8ad0);
  background-size:420% 420%;
  animation:borderAnim 6s ease infinite, glowPulse 3s ease-in-out infinite;
  box-shadow:0 0 30px rgba(255,180,255,0.45);
  z-index:2;
}
@keyframes borderAnim{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
@keyframes glowPulse{
  0%,100%{box-shadow:0 0 24px rgba(255,180,255,.35);}
  50%{box-shadow:0 0 58px rgba(255,220,255,.78);}
}

/* Tarjeta */
.card{
  background:rgba(255,255,255,0.86);
  backdrop-filter:blur(10px);
  border-radius:24px;
  padding:22px 20px 18px;
  text-align:center;
  width:min(460px,90vw);
  box-shadow:0 4px 12px rgba(0,0,0,.25), inset 0 4px 8px rgba(255,255,255,.35);
  position:relative;
  overflow:hidden;
}

/* 💓 Latido suave */
@keyframes heartbeat {
  0%,100% { transform: scale(1); }
  25% { transform: scale(1.025); }
  50% { transform: scale(0.985); }
  75% { transform: scale(1.04); }
}
.card.heartbeat{ animation:heartbeat 1.25s ease-in-out; }

/* GIF box */
.gifBox{
  width:100%;
  aspect-ratio:1.35/1;
  max-height:320px;
  border-radius:18px;
  overflow:hidden;
  margin-bottom:14px;
  background:#fff3;
  box-shadow: inset 0 0 0 1px #fff6, 0 10px 26px rgba(0,0,0,.12);
}
.gifBox img{width:100%;height:100%;object-fit:cover;display:block}

h1{margin:4px 0 6px;font-size:28px;line-height:1.2;color:var(--txt)}
.sub{margin:0 0 12px;color:var(--muted);font-size:15px}

/* 🔋 Barra de paciencia */
.meterWrap{
  width:min(420px, 88%);
  margin:10px auto 14px;
  text-align:left;
}
.meterLabel{
  display:flex; justify-content:space-between; align-items:center;
  font-size:12px; color:#333a;
  margin:0 2px 6px;
}
.meter{
  height:12px;
  border-radius:999px;
  background:rgba(0,0,0,.08);
  overflow:hidden;
  box-shadow: inset 0 1px 6px rgba(0,0,0,.10);
}
.meter > div{
  height:100%;
  width:100%;
  border-radius:999px;
  background: linear-gradient(90deg, #27c16f, #ffd86f, #ff4d4f);
  transition: width .45s ease;
  box-shadow: 0 0 18px rgba(255,100,160,.25);
}

/* Botones */
.btnRow{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  position:relative;
  height:60px;
}
.btn{
  min-width:126px;
  padding:14px 18px;
  border:none;
  cursor:pointer;
  border-radius:18px;
  color:#fff;
  font-weight:800;
  letter-spacing:.2px;
  box-shadow:0 10px 22px rgba(0,0,0,.18);
  transition:transform .25s ease,opacity .3s ease,left .4s ease,top .4s ease, filter .25s ease;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.yes{ background:var(--yes); }
.no{ background:var(--no); }
.no.disabled{ opacity:0; pointer-events:none; }

/* 😈 Modo tensión (cuando baja paciencia) */
.danger .cardWrapper{
  animation:borderAnim 3.2s ease infinite, glowPulse 1.8s ease-in-out infinite;
}
.danger #aurora{
  filter:blur(16px) saturate(1.35);
}
.danger .btn.no{ filter:brightness(1.1) saturate(1.25); }
.danger .btn.yes{ box-shadow:0 0 18px rgba(39,193,111,.55), 0 0 44px rgba(39,193,111,.25); }

/* Botón NO que escapa al final */
.noEscapa{
  background:var(--no);
  position:fixed;
  display:none;
  z-index:20;
  border-radius:18px;
  color:#fff;
  font-weight:800;
  padding:14px 18px;
  min-width:126px;
  text-align:center;
  transition:left .35s ease, top .35s ease, transform .2s ease;
}

/* Explosión */
.boom{ animation:explode .6s ease-out forwards; }
@keyframes explode{
  from{ transform:scale(1); opacity:1; }
  to{ transform:scale(2.2); opacity:0; }
}

/* Shake suave */
.shake{ animation:shake 0.6s ease-in-out; filter:blur(.8px) brightness(1.08); }
@keyframes shake{
  0%,100%{transform:translateX(0)}
  10%,30%,50%,70%,90%{transform:translateX(-8px)}
  20%,40%,60%,80%{transform:translateX(8px)}
}

/* Botón Sí centrado (fin) */
.yes.centered{
  position:absolute;
  left:50%;
  bottom:10px;
  transform:translateX(-50%) scale(1);
  animation:centerYes 1.05s ease-in-out forwards;
  z-index:10;
  box-shadow:0 0 18px rgba(39,193,111,.65),0 0 52px rgba(39,193,111,.28);
}
@keyframes centerYes{
  0%{ transform:translateX(-50%) scale(1); }
  60%{ transform:translateX(-50%) scale(1.32); }
  100%{ transform:translateX(-50%) scale(1.16); }
}

/* Final */
.final{
  position:fixed; inset:0; display:none; place-items:center; z-index:15;
  background:
    radial-gradient(900px 900px at 50% 35%, #ffffffcc, #ffffff66 60%, #ffffff00 75%),
    linear-gradient(135deg,#ffe2f2,#e4fff7);
}
.final.show{ display:grid; }
.finalBox{ width:min(540px,92vw); text-align:center; padding:10px 0; }
.finalBox h2{
  font-size:42px;
  margin:8px 0 10px;
  color:var(--pink);
  text-shadow:0 6px 22px #ff8fc2aa;
}
.finalBox p{ margin:0 0 16px; color:#444; font-size:16px; }

.confetti{ position:fixed; inset:0; pointer-events:none; z-index:50; }
.mini{ position:fixed; bottom:8px; right:12px; font-size:12px; color:#fff9; z-index:60; }

@media (max-width:600px){
  .btn{ min-width:112px; padding:12px 14px; }
  h1{ font-size:24px; }
  .finalBox h2{ font-size:36px; }
}
</style>
</head>
<body>

<div id="aurora"></div>
<div id="bubbles"></div>
<canvas class="confetti"></canvas>

<div class="cardWrapper" id="wrap">
  <div class="card" id="card">
    <div class="gifBox"><img id="gif" alt="gif"></div>
    <h1 id="title">Última oportunidad… 🥺</h1>
    <p class="sub" id="sub">Mi paciencia se está acabando… pero mi amor no 💗</p>

    <div class="meterWrap">
      <div class="meterLabel">
        <span>Paciencia</span>
        <span id="meterPct">100%</span>
      </div>
      <div class="meter"><div id="meterFill"></div></div>
    </div>

    <div class="btnRow">
      <button class="btn yes" id="btnYes">Me Perdonas</button>
      <button class="btn no" id="btnNo">No Me Perdonas</button>
    </div>
  </div>
</div>

<button class="btn noEscapa" id="btnNoEscapa">No</button>

<div class="final" id="final">
  <div class="finalBox">
    <div class="gifBox" style="margin-inline:auto; max-width:480px;">
      <img id="finalGif" alt="final">
    </div>
    <h2>Sabía que ibas a decir que sí 💘</h2>
    <p>Listo… ven acá, abrazame y ya 🫶</p>
  </div>
</div>

<div class="mini">ig: @santiiceballos</div>

<script>
/* 💖 Corazones flotantes */
const bubbleContainer = document.getElementById("bubbles");
const colors=["#ff6fb1","#ff9aff","#ff8ad0","#ffb6a9","#ffd86f","#9cfaff","#c79aff"];
for(let i=0;i<26;i++){
  const h=document.createElement("div");
  h.className="heart";
  const size=18+Math.random()*44;
  const color=colors[Math.floor(Math.random()*colors.length)];
  h.style.width=h.style.height=size+"px";
  h.style.left=(Math.random()*100)+"%";
  h.style.animationDuration=(14+Math.random()*16)+"s";
  h.style.animationDelay=(Math.random()*10)+"s";
  h.style.color=color;
  h.style.opacity=(Math.random()*0.75+0.25).toFixed(2);
  h.style.filter=`drop-shadow(0 0 10px ${color}aa)`;
  bubbleContainer.appendChild(h);
}

/* GIFs */
const GIFS = [
 "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExdGN4OWVtM3d2N2VrdnBnMzk5ZTlkbnF0OXZlaWNxdnkzcDltZ2MybSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/TZBED1pP5m8N2/giphy.gif",
 "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3MGlhaHJmOHhydjdhNjd6ODcwbHYzNHR6Mjl1YjRxNmV1aWt2NXgzbCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/6kZk1nKGP9xyqwfHkW/giphy.gif",
 "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExNnZubTc5djF4c2RxcWl3YnAweno0aGFwd2ZvcXRiZzI1OWthNXd6byZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/o3KnXAHIqsVcQ/giphy.gif",
 "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExc2xkand5OGNnZjlpcjNycTd6YmVpZ2Rub3ZoaHBqOGhnaTFuMDY0NCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tRoH9EYLs3lok/giphy.gif",
 "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3eGxhZHRldjFjMXdrcHBzc3ozMXUzcjY4YmdlcXV1MGR3YnFwdjNmYSZlcD12MV9naWZzX3JlbGF0ZWQmY3Q9Zw/6KmLHrQhAeH5fC0ZT1/giphy.gif"
];
const STEPS = [
 { t:"Una última oportunidad… 🥺", s:"Mi paciencia se está acabando… pero mi amor no 💗", p:100,gif:0 },
 { t:"Oye… ya en serio 😤", s:"No me hagas usar el modo dramático…", p:75, gif:1 }, 
 { t:"Ok… me estás preocupando 😰", s:"Te queda una última oportunidad.", p:45, gif:2 },
 { t:"Se acabó mi paciencia 🔥", s:"El botón ‘No’ ya no es seguro…", p:20, gif:3 },
];
const FINAL_GIF = GIFS[4];

/* DOM */
const body = document.body;
const wrap = document.getElementById("wrap");
const card = document.getElementById("card");
const gif = document.getElementById("gif");
const title = document.getElementById("title");
const sub = document.getElementById("sub");
const meterFill = document.getElementById("meterFill");
const meterPct = document.getElementById("meterPct");
const btnYes = document.getElementById("btnYes");
const btnNo = document.getElementById("btnNo");
const btnNoEscapa = document.getElementById("btnNoEscapa");
const final = document.getElementById("final");
const finalGif = document.getElementById("finalGif");
const cv = document.querySelector(".confetti");
const ctx = cv.getContext("2d");

/* Canvas nítido */
function sizeCanvas(){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.width = Math.floor(innerWidth * dpr);
  cv.height = Math.floor(innerHeight * dpr);
  cv.style.width = innerWidth + "px";
  cv.style.height = innerHeight + "px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize", sizeCanvas);
sizeCanvas();

/* Estado */
let stage = 0;
let noAttempts = 0;
let touchLock = false;
let conf = [];
let burst = [];

/* Inicio */
addEventListener("load", () => updateStage(0));

function updateStage(i){
  const st = STEPS[i];
  gif.src = GIFS[st.gif];
  title.textContent = st.t;
  sub.textContent = st.s;
  meterFill.style.width = st.p + "%";
  meterPct.textContent = st.p + "%";

  card.classList.add("heartbeat");
  setTimeout(()=>card.classList.remove("heartbeat"), 1250);

  // modo tensión
  if(st.p <= 45) body.classList.add("danger");
  else body.classList.remove("danger");

  // si ya es la última etapa, preparamos el NO que escapa
  if(i === STEPS.length - 1){
    btnNo.classList.add("disabled");
    const r = btnNo.getBoundingClientRect();
    btnNoEscapa.style.left = r.left + "px";
    btnNoEscapa.style.top = r.top + "px";
    btnNoEscapa.style.display = "inline-block";
  }
}

/* Click NO (etapas) */
btnNo.addEventListener("click", () => {
  if(stage < STEPS.length - 1){
    stage++;
    updateStage(stage);
  }
});

/* NO que escapa */
function registerNoAttempt(e){
  if(e && e.preventDefault) e.preventDefault();
  if(touchLock) return;
  touchLock = true; setTimeout(()=>touchLock=false, 220);

  noAttempts++;
  // baja la paciencia visualmente por cada intento
  const current = Math.max(0, parseInt(meterFill.style.width || "20",10) - 8);
  meterFill.style.width = current + "%";
  meterPct.textContent = current + "%";
  if(current <= 18) body.classList.add("danger");

  if(noAttempts >= 3){
    explodeNoButton();
  }else{
    moveNoButton();
    // mini “amenaza” en subtítulo
    const lines = [
      "¿En serio lo intentaste? 😐",
      "No no no… eso no se hace 😈",
      "Último aviso… 👀"
    ];
    sub.textContent = lines[Math.min(noAttempts-1, lines.length-1)];
  }
}
btnNoEscapa.addEventListener("click", registerNoAttempt);
btnNoEscapa.addEventListener("pointerenter", () => {
  // en desktop, con solo acercar el mouse también se mueve
  if(/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) return;
  registerNoAttempt({ preventDefault(){} });
});

function moveNoButton(){
  const m = 14;
  const r = btnNoEscapa.getBoundingClientRect();
  const w = innerWidth, h = innerHeight;

  // Evitar que se pegue a bordes y que se vaya demasiado arriba
  const topSafe = 70;
  const x = Math.random() * (w - r.width - m*2) + m;
  const y = Math.random() * (h - r.height - m*2 - topSafe) + m + topSafe;

  btnNoEscapa.style.left = x + "px";
  btnNoEscapa.style.top  = y + "px";
  btnNoEscapa.style.transform = `scale(${1 + noAttempts*0.06})`;
}

function explodeNoButton(){
  spawnBurst(btnNoEscapa.getBoundingClientRect());
  btnNoEscapa.classList.add("boom");
  card.classList.add("shake");
  btnYes.classList.add("centered");

  // “relleno mágico”: la paciencia se llena un poquito al final
  meterFill.style.width = "32%";
  meterPct.textContent = "32%";

  setTimeout(()=>{
    btnNoEscapa.style.display="none";
    card.classList.remove("shake");
    sub.textContent = "Listo… solo queda una opción 😌💗";
  }, 800);
}

/* Click SÍ */
btnYes.addEventListener("click", () => {
  btnNoEscapa.style.display="none";
  finalGif.src = FINAL_GIF;
  final.classList.add("show");
  launchConfetti(170);
  setTimeout(()=>{ conf=[]; burst=[]; }, 6500);
});

/* Confetti + burst */
function launchConfetti(n=140){
  conf = Array.from({length:n}, ()=>({
    x: Math.random()*innerWidth,
    y: -20 - Math.random()*60,
    r: 6 + Math.random()*8,
    c: `hsl(${Math.floor(Math.random()*360)} 90% 60%)`,
    vy: 1.1 + Math.random()*2.3,
    ang: Math.random()*Math.PI*2,
    vang: .02 + Math.random()*.05
  }));
}
function spawnBurst(rect){
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  for(let i=0;i<30;i++){
    const a = (i/30)*Math.PI*2;
    const sp = 2.2 + Math.random()*2.8;
    burst.push({
      x: cx, y: cy, r: 3 + Math.random()*3.5,
      c: `hsl(${330 + Math.random()*24} 90% 60%)`,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp,
      life: 38 + Math.random()*12
    });
  }
}
function drawTri(x,y,r,color,rot){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(0,-r);
  ctx.lineTo(r,r);
  ctx.lineTo(-r,r);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function loop(){
  requestAnimationFrame(loop);
  ctx.clearRect(0,0,innerWidth,innerHeight); 

  conf.forEach(p=>{
    p.y += p.vy;
    p.ang += p.vang;
    const wobble = Math.sin(p.ang)*6;
    drawTri(p.x+wobble, p.y, p.r, p.c, p.ang*0.6);
  });
  conf = conf.filter(p => p.y < innerHeight + 40); 

  burst.forEach(p=>{
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.05;
    p.life--;
    drawTri(p.x, p.y, p.r, p.c, 0);
  });
  burst = burst.filter(p => p.life > 0);
}
loop();
</script>
</body>
</html>
