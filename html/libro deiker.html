<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Libro Marvel 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        /* --- CONFIGURACIÓN DE VARIABLES Y ESTILOS BASE --- */
        :root {
            --book-w: 960px;
            --book-h: 620px;
            --page-w: calc(var(--book-w) / 2);
            --page-h: var(--book-h);
            --persp: 3600px;
            --cover-bg: #b03060;
            --cover-accent: #f8c8dc;
            --ink: #2c1a1a;
            --radius: 14px
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        /* Fondo animado con gradiente espacial */
        body,
        html {
            height: 100%;
            overflow: hidden;
            font-family: 'Great Vibes', cursive;
            background: linear-gradient(120deg, #0b0020, #0d1b3d, #203, #001a26);
            background-size: 400% 400%;
            animation: gradientShift 30s ease infinite
        }

        @keyframes gradientShift {
            0% { background-position: 0 50% }
            50% { background-position: 100% 50% }
            100% { background-position: 0 50% }
        }

        /* --- ELEMENTOS AMBIENTALES: ESTRELLAS Y CORAZONES --- */
        .stars {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            opacity: 0;
            animation: twinkle linear infinite
        }

        @keyframes twinkle {
            0%, 100% { opacity: .2; transform: scale(.8) }
            50% { opacity: 1; transform: scale(1.4) }
        }

        .shooting-star {
            position: fixed;
            width: 140px;
            height: 2px;
            background: linear-gradient(90deg, #fff, transparent);
            filter: drop-shadow(0 0 6px white);
            opacity: .9;
            z-index: 10000;
            pointer-events: none
        }

        /* --- ESTRUCTURA DEL LIBRO 3D --- */
        .scene {
            position: fixed;
            inset: 0;
            perspective: var(--persp);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3
        }

        .book {
            width: var(--book-w);
            height: var(--book-h);
            position: absolute;
            top: 50%;
            left: 50%;
            transform-style: preserve-3d;
            opacity: 0;
            transform: translate(-50%, -50%) scale(.9);
            transition: opacity 1s ease, transform 1s cubic-bezier(.25, .8, .25, 1)
        }

        .book.ready {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1)
        }

        /* Hojas del libro */
        .sheet {
            width: var(--page-w);
            height: var(--page-h);
            position: absolute;
            top: 0;
            left: 50%;
            transform-origin: left center;
            transform-style: preserve-3d;
            border-radius: var(--radius);
            overflow: visible
        }

        .face {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            border-radius: var(--radius);
            overflow: hidden
        }

        .face.left {
            transform: rotateY(180deg)
        }

        /* Diseño de las páginas internas y portadas */
        .page {
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            text-align: center;
            font-size: 2.6rem;
            line-height: 1.6;
            background: linear-gradient(135deg, #fffef9, #fdf6e3);
            box-shadow: inset 0 0 12px rgba(0, 0, 0, .15);
            z-index: 0
        }

        /* --- INTERFAZ Y EFECTOS --- */
        .audio-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 52px;
            height: 52px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, .65);
            color: #fff;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            pointer-events: auto !important
        }

        .hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 11000
        }

        .hearts span {
            position: absolute;
            opacity: .85;
            font-size: 2rem
        }

        @keyframes floatV {
            0% { transform: translateY(0) scale(1); opacity: .85 }
            100% { transform: translateY(-120vh) scale(1.5); opacity: 0 }
        }

        /* Estilos de sombreado y reflejos para realismo 3D */
        .shadow {
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            pointer-events: none;
            opacity: 0;
            transition: opacity .35s ease;
            mix-blend-mode: multiply
        }

        .curl-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0
        }
    </style>
</head>

<body>
    <div class="stars" id="stars"></div>
    <div class="scene" id="scene">
        <div class="book closed closed-front" id="book"></div>
    </div>
    <div class="hearts" id="hearts"></div>

    <script>

            let o = !1;

                const e = innerWidth, t = innerHeight;
                o = t > e

            addEventListener("resize", s);

            // --- CONSTRUCCIÓN DE PORTADAS ---
            const p = () => { /* Crea Portada Frontal */
                const e = document.createElement("div");

                t.appendChild(f); t._shadow = f;

            let h = 0; const y = 1 / 60; let g = !1;

            function v() { // Función que anima el giro de la página

            function b(e) { /* Inicia el arrastre de la página */

    </script>
