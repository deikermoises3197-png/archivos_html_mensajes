<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pocoyo 😃</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}

    body{
      background:#ffffff;
      color:#111;
      font-family:Inter, system-ui, Arial;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .viewer{
  width:100%;
  max-width:350px;  /* Mantiene tamaño tipo celular SIEMPRE */
  margin:auto;
  text-align:center;
  position:relative;
}


    .gif{
      width:100%;
      border-radius:10px;
      transition:opacity .28s ease, transform .28s ease;
    }

    .controls{
      display:none;
      gap:12px;
      justify-content:center;
      margin-top:14px;
    }

   .btn{
      user-select:none;
      border:0;
      padding:18px 32px;
      font-size:40px;
      border-radius:14px;
      cursor:pointer;
      font-weight:700;
      box-shadow:0 8px 20px rgba(0,0,0,0.18);
      transition:0.25s ease;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      line-height:1;
    }

    #prev{
      background:linear-gradient(145deg, #ff4b4b, #d62828);
    }

    #next{
      background:linear-gradient(145deg, #2ecc71, #239b56);
    }

    #reset{
      background:linear-gradient(145deg, #1e88e5, #1565c0);
      display:none;
    }

    .btn:hover{
      transform:translateY(-4px);
      box-shadow:0 14px 28px rgba(0,0,0,0.25);
      filter:brightness(1.1);
    }

    .btn:active{
      transform:scale(0.95);
      box-shadow:0 6px 12px rgba(0,0,0,0.20);
      filter:brightness(0.95);
    }

    .meta{
      margin-top:10px;
      font-size:14px;
      color:#222;
      display:none;
       display:none !important;
    }

    .heart{
      position:fixed;
      top:100vh;
      color:#ff3366;
      animation:flotar linear forwards;
      pointer-events:none;
      opacity:0.85;
    }

    @keyframes flotar{
      0%{transform:translateY(0) scale(1); opacity:1;}
      100%{transform:translateY(-120vh) scale(1.8); opacity:0;}
    }

    audio{display:none}

  </style>
</head>

  <main class="viewer">

<div style="display:flex; justify-content:center;">
  <button id="startBtn" style="
    padding:20px 40px;
    font-size:26px;
    font-weight:700;
    border-radius:14px;
    background:#1e88e5;
    color:white;
    border:0;
    cursor:pointer;
    margin-top:20px;
    box-shadow:0 10px 20px rgba(0,0,0,0.18);
  ">Reproducir Audio 🎵</button>
</div>


    <!-- CONTROLES -->
    <div class="controls" id="controls">
      <button class="btn" id="prev">⟵</button>
      <button class="btn" id="reset">⟲</button> 
      <button class="btn" id="next">⟶</button>
    
    </div>

    <div class="meta" id="meta">
       <span id="current"></span>  <span id="total"></span>
    </div>

let index = 0;

/* ELEMENTOS */
const display = document.getElementById("display");
const controls = document.getElementById("controls");
const meta = document.getElementById("meta");
const startBtn = document.getElementById("startBtn");
const musica = document.getElementById("musica");
const current = document.getElementById("current");
const total = document.getElementById("total");
const resetBtn = document.getElementById("reset");

total.textContent = gifs.length;

/* FUNCION MOSTRAR */
function show(i){
  index = (i + gifs.length) % gifs.length;
  display.style.opacity = "0";
  setTimeout(()=>{
    display.src = gifs[index];
    current.textContent = index + 1;
    display.style.opacity = "1";
  },180);
}

/* BOTÓN INICIAR */
startBtn.addEventListener("click", ()=>{
  musica.play().catch(()=>{});
  controls.style.display = "flex";
  meta.style.display = "block";
  startBtn.style.display = "none";
  resetBtn.style.display = "flex";
});

/* AVANZAR / RETROCEDER */
document.getElementById("prev").onclick = ()=> show(index - 1);
document.getElementById("next").onclick = ()=> show(index + 1);

/* BOTÓN REINICIAR */
resetBtn.addEventListener("click", ()=>{

  musica.pause();
  musica.currentTime = 0;

  controls.style.display = "none";
  meta.style.display = "none";
  resetBtn.style.display = "none";
  startBtn.style.display = "block";

  index = 0;
  show(0);
});
</script>

<script>
/* CORAZONES */
function crearCorazon(){
  const c = document.createElement('div');
  c.className = 'heart';
  c.textContent = '❤';
  c.style.left = Math.random()*100 + 'vw';
  c.style.fontSize = (20 + Math.random()*20) + 'px';
  c.style.animationDuration = (3 + Math.random()*3) + 's';
  document.body.appendChild(c);
  setTimeout(()=> c.remove(), 6000);
}
setInterval(crearCorazon, 400);
</script>
