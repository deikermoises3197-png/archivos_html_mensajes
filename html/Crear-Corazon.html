<body>

<script>
const input = document.getElementById('photos');
const btn = document.getElementById('create');
const letters = [...document.querySelectorAll('.letter')];
const slots = [...document.querySelectorAll('.photo-slot')];
const TOTAL = 25;

/* 🔥 COMPRESIÓN AUTOMÁTICA */
async function compressImage(file, maxSize = 1200, quality = 0.75){
  return new Promise(resolve=>{
    const img=new Image();
    const r=new FileReader();
    r.onload=()=>{
      img.onload=()=>{
        let {width,height}=img;
        if(width>height && width>maxSize){
          height=Math.round(height*maxSize/width);
          width=maxSize;
        }else if(height>maxSize){
          width=Math.round(width*maxSize/height);
          height=maxSize;
        }
        const c=document.createElement('canvas');
        c.width=width; c.height=height;
        c.getContext('2d').drawImage(img,0,0,width,height);
        c.toBlob(b=>resolve(b),'image/jpeg',quality);
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

/* PREVIEW + COMPRESIÓN */
input.onchange = async ()=>{
  const files=[...input.files];
  if(files.length!==TOTAL){
    alert('Debes seleccionar exactamente 25 fotos');
    input.value='';
    return;
  }

  const blobs = await Promise.all(files.map(f=>compressImage(f)));
  const urls = blobs.map(b=>URL.createObjectURL(b));

  letters.forEach((el,i)=>{
    el.style.backgroundImage=`url(${urls[i]})`;
    el.classList.add('filled');
  });
  slots.forEach((el,i)=>{
    el.style.backgroundImage=`url(${urls[i+5]})`;
  });

  window._compressedImages = blobs;
};

/* BASE64 */
function toBase64(f){
  return new Promise(r=>{
    const fr=new FileReader();
    fr.onload=()=>r(fr.result);
    fr.readAsDataURL(f);
  });
}

/* DESCARGA */
btn.onclick = async ()=>{
  if(!window._compressedImages || window._compressedImages.length!==TOTAL){
    alert('Primero agrega las 25 fotos');
    return;
  }

  const imgs = await Promise.all(window._compressedImages.map(b=>toBase64(b)));
  const layout = slots.map(s=>({
    left:s.style.left, top:s.style.top,
    width:s.style.width, height:s.style.height
  }));

  const out = `<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>TE AMO ❤️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,system-ui}
body{

  display:flex;
  justify-content:center;
  align-items:center;
  padding:16px;
  overflow:hidden;
  position:relative;
}
body::before{
  content:"";
  position:absolute;
  inset:-30%;
  background:
    radial-gradient(circle at 30% 20%, rgba(255, 254, 254, 1), transparent 55%),
    radial-gradient(circle at 70% 80%, rgba(102, 239, 4, 0.45), transparent 55%),
    linear-gradient(180deg, #ffffffff, #012fffff 70%);
  background-size:200% 200%;
  animation: skyDriftLight 30s ease-in-out infinite;
  z-index:0;
}
@keyframes skyDriftLight{
  0%{
    transform:translate(0,0) scale(1);
    filter:hue-rotate(0deg);
  }
  50%{
    transform:translate(-6%, -4%) scale(1.04);
    filter:hue-rotate(10deg);
  }
  100%{
    transform:translate(0,0) scale(1);

}






.page{width:100%;max-width:900px;display:flex;flex-direction:column;align-items:center}
.teamo{display:flex;gap:clamp(24px,6vw,60px)}
.word{display:flex;gap:clamp(10px,3vw,26px)}
.letter,.photo-slot{opacity:0;transform:scale(.95);transition:1.2s}
.show{opacity:1;transform:scale(1)}
.letter{
  font-size:clamp(86px,18vw,120px);

  color:transparent;
  -webkit-background-clip:text;
  background-clip:text;
  background-size:cover;
  background-position:center;
  filter: drop-shadow(0 0 6px rgba(17, 255, 0, 1)); 
}

.photo-slot{
  position:absolute;
  background-size:cover;
  background-position:center;

}

.page{

<body>
<canvas id="fireworks"></canvas>

<div class="page">
  <div class="teamo">
    <div class="word">
      <div class="letter" style="background-image:url('${imgs[0]}')">T</div>
      <div class="letter" style="background-image:url('${imgs[1]}')">E</div>
      <div class="letter" style="background-image:url('')"> </div>
    </div>
    <div class="word">
      <div class="letter" style="background-image:url('${imgs[2]}')">A</div>

<script>
window.addEventListener('load',()=>{
  const els=[...document.querySelectorAll('.letter,.photo-slot')];
  els.sort(()=>Math.random()-0.5);
  els.forEach((el,i)=>setTimeout(()=>el.classList.add('show'),120*i));
});

const canvas = document.getElementById('fireworks');
const ctx = canvas.getContext('2d');
let w,h;

function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const fireworks = [];
const colors = ['#000000ff','#ff0040ff','#00ff15ff','#1605ffff'];

class Firework{
  constructor(){
    this.x = Math.random()*w;
    this.y = h;
    this.targetY = Math.random()*h*0.45 + h*0.15;
    this.color = colors[Math.floor(Math.random()*colors.length)];
    this.speed = Math.random()*2 + 2;
    this.exploded = false;
    this.particles = [];
  }
  update(){
    if(!this.exploded){
      this.y -= this.speed;
      if(this.y <= this.targetY){
        this.exploded = true;
        for(let i=0;i<40;i++){ // MÁS PARTÍCULAS
  this.particles.push({
    x:this.x,
    y:this.y,
     vx:(Math.random()-0.5)*9, // explosión más amplia
    vy:(Math.random()-0.5)*9,
    life:Math.random()*80+80  // DURAN MÁS
  });
        }
      }
    }
  }
  draw(){
    if(!this.exploded){
      ctx.fillStyle=this.color;
      ctx.fillRect(this.x,this.y,2,2);
    }else{
      this.particles.forEach(p=>{
        ctx.fillStyle=this.color;
        ctx.fillRect(p.x,p.y,2,2);
      });
    }
  }
}

function animate(){
  ctx.clearRect(0,0,w,h);

  if(Math.random() < 0.05){
  fireworks.push(new Firework());
}


  fireworks.forEach((f,i)=>{
    f.update();
    if(f.exploded){
      f.particles.forEach(p=>{
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.03;
        p.life--;
      });
      f.particles = f.particles.filter(p=>p.life>0);
      if(!f.particles.length) fireworks.splice(i,1);
    }
    f.draw();
  });

  requestAnimationFrame(animate);
}

for(let i=0;i<6;i++){
  fireworks.push(new Firework());
}


animate();

<\/script>
</body>

</script>
