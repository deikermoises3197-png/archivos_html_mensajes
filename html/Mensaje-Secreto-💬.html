<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mensaje Secreto 💬</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: #000; overflow: hidden; font-family: 'Montserrat', sans-serif;
            height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center;
        }

        /* --- NUEVO CONTENEDOR DEL MENSAJE --- */
        #message-container {
            position: absolute;
            z-index: 0; /* Detrás del canvas */
            display: none; /* Se muestra cuando carga la foto */
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Recorta el texto si es más grande que la foto */
            pointer-events: none;
        }

        /* El texto dentro del contenedor */
        #hidden-message-text {
            font-family: 'Dancing Script', cursive;
            color: #ff0077; font-size: 3.5rem; text-align: center;
            text-shadow: 0 0 30px #ff0077, 0 0 10px rgba(255,255,255,0.5);
            width: 90%; /* Margen interno de seguridad */
            word-wrap: break-word; /* Permite que el texto largo se ajuste */
        }

        /* LIENZO PRINCIPAL (Partículas) */
        canvas { 
            display: block; position: absolute; top: 0; left: 0; 
            z-index: 1; /* Delante del mensaje */
        }

        /* UI FORMULARIO */
        #setup-ui {
            position: absolute; z-index: 100; background: rgba(10,10,10,0.95);
            padding: 30px; border-radius: 20px; border: 1px solid #ff0077;
            text-align: center; box-shadow: 0 0 50px rgba(255, 0, 119, 0.4);
            backdrop-filter: blur(10px); width: 90%; max-width: 400px;
        }
        h1 { color: #ff0077; margin-bottom: 20px; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }
        .btn-upload {
            display: block; padding: 15px; margin: 10px 0; border: 1px dashed #ff0077;
            color: #ccc; border-radius: 10px; cursor: pointer; transition: 0.3s;
        }
        
        /* --- CLASE DE ÉXITO (VERDE NEÓN) --- */
        .success {
            border-style: solid !important;
            border-color: #00ff66 !important;
            background: rgba(0, 255, 102, 0.15) !important;
            color: white !important;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
        }

        input[type="file"] { display: none; }
        #start-btn {
            background: linear-gradient(45deg, #ff0077, #ff5500); color: white; border: none; padding: 15px 40px;
            border-radius: 30px; font-weight: bold; margin-top: 20px; cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 119, 0.5); opacity: 0.5; pointer-events: none; transition: 0.3s;
        }
        /* Botón Activo */
        #start-btn.active { opacity: 1; pointer-events: all; box-shadow: 0 0 30px #ff0077; }
        
        #setup-message-input {
            width: 100%; padding: 10px; margin: 10px 0; border-radius: 10px; border: 1px solid #ff0077;
            background: rgba(255,255,255,0.1); color: white; text-align: center; font-family: inherit; resize: none; transition: 0.3s;
        }

        #hint {
            position: fixed; top: 20px; color: rgba(255,255,255,0.5); z-index: 10;
            font-size: 0.8rem; letter-spacing: 1px; pointer-events: none; display: none;
            text-transform: uppercase; text-shadow: 0 0 10px rgba(0,0,0,1);
        }

        #player {
            display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2); align-items: center; gap: 15px; z-index: 50;
            backdrop-filter: blur(5px);
        }
        #play-btn { background: none; border: none; color: #ff0077; font-size: 1.5rem; cursor: pointer; }
        
        #btn-download {
            display: none; position: fixed; top: 20px; right: 20px; z-index: 100;
            background: rgba(0,0,0,0.5); color: white; border: 1px solid white;
            padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 0.7rem;
        }
    </style>
</head>
<body>

    <div id="message-container">
        <div id="hidden-message-text">TE AMO<br>MI VIDA ❤️</div>
    </div>

    <div id="setup-ui">
        <h1>Mensaje Secreto ✨</h1>
        <textarea id="setup-message-input" rows="3" placeholder="Mensaje oculto...">TE AMO MI VIDA ❤️</textarea>
        
        <label class="btn-upload" id="lbl-img">
            <span id="txt-img">📷 Subir Foto</span>
            <input type="file" id="inp-img" accept="image/*">
        </label>
        
        <label class="btn-upload" id="lbl-audio">
            <span id="txt-audio">🎵 Subir Música</span>
            <input type="file" id="inp-audio" accept="audio/*">
        </label>
        
        <button id="start-btn">CREAR EXPERIENCIA</button>
    </div>

    <div id="hint">Pasa el dedo para revelar el secreto</div>
    <canvas id="canvas1"></canvas>
    <button id="btn-download">GUARDAR</button>

    <audio id="audio" loop></audio>
    <div id="player">
        <button id="play-btn">▶</button>
        <div style="width: 100px; height: 3px; background: #333; border-radius: 2px;">
            <div id="progress" style="width: 0%; height: 100%; background: #ff0077; transition: width 0.2s;"></div>
        </div>
    </div>

    <script>
        // --- MARCADORES DE SEGURIDAD PARA LA DESCARGA ---
        var SAVE_IMG = "___IMG___";
        var SAVE_AUD = "___AUD___";
        var SAVE_MSG = "___MSG___";

        const canvas = document.getElementById('canvas1');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const msgContainer = document.getElementById('message-container');
        const msgText = document.getElementById('hidden-message-text');

        let particlesArray = [];
        const gap = 3; 
        
        // --- RADIO PEQUEÑO (BOLA AJUSTADA) ---
        const mouse = { x: undefined, y: undefined, radius: 4000 }; 

        // --- CLASE PARTÍCULA ---
        class Particle {
            constructor(x, y, color) {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.originX = x;
                this.originY = y;
                this.color = color;
                // Truco de sellado para fondo sólido
                this.size = gap + 0.2; 
                this.vx = 0;
                this.vy = 0;
                this.friction = 0.9;
                this.ease = 0.1;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
            update() {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = dx * dx + dy * dy;
                let force = (-mouse.radius / distance) * 2;
                if (distance < mouse.radius) {
                    let angle = Math.atan2(dy, dx);
                    this.vx += force * Math.cos(angle);
                    this.vy += force * Math.sin(angle);
                }
                this.x += (this.vx *= this.friction) + (this.originX - this.x) * this.ease;
                this.y += (this.vy *= this.friction) + (this.originY - this.y) * this.ease;
            }
        }

        // --- INICIAR ANIMACIÓN ---
        function initImage(imgBase64) {
            const image = new Image();
            image.src = imgBase64;
            image.onload = function() {
                let scale = Math.min(canvas.width / image.width, canvas.height / image.height) * 0.8;
                let w = image.width * scale;
                let h = image.height * scale;
                let x = (canvas.width - w) / 2;
                let y = (canvas.height - h) / 2;

                msgContainer.style.width = w + 'px';
                msgContainer.style.height = h + 'px';
                msgContainer.style.left = x + 'px';
                msgContainer.style.top = y + 'px';
                msgContainer.style.display = 'flex';

                ctx.drawImage(image, x, y, w, h);
                const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particlesArray = [];
                for (let y = 0; y < canvas.height; y += gap) {
                    for (let x = 0; x < canvas.width; x += gap) {
                        const index = (y * canvas.width + x) * 4;
                        const alpha = pixels[index + 3];
                        if (alpha > 128) {
                            const red = pixels[index];
                            const green = pixels[index + 1];
                            const blue = pixels[index + 2];
                            const color = `rgb(${red},${green},${blue})`;
                            particlesArray.push(new Particle(x, y, color));
                        }
                    }
                }
                animate();
            };
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].draw();
                particlesArray[i].update();
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('mousemove', e => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('touchmove', e => { 
            e.preventDefault(); 
            mouse.x = e.touches[0].clientX; 
            mouse.y = e.touches[0].clientY; 
        }, { passive: false });
        window.addEventListener('touchend', () => { mouse.x = undefined; mouse.y = undefined; });
        window.addEventListener('mouseout', () => { mouse.x = undefined; mouse.y = undefined; });

        // --- LÓGICA DE CONTROL ---
        
        // 1. SI ES ARCHIVO DESCARGADO
        if (SAVE_IMG !== "___IMG___") {
            document.getElementById('setup-ui').style.display = 'none';
            document.getElementById('hint').style.display = 'block';
            document.getElementById('player').style.display = 'flex';
            
            msgText.innerHTML = SAVE_MSG;
            const audio = document.getElementById('audio');
            audio.src = SAVE_AUD;
            initImage(SAVE_IMG);
            
            document.body.addEventListener('click', () => { audio.play(); }, {once:true});
        } 
        
        // 2. SI ES MODO CREACIÓN
        else {
            let tempImg = "", tempAud = "";
            let iReady = false, aReady = false;

            // -- FEEDBACK VISUAL MENSAJE (VERDE) --
            const msgInput = document.getElementById('setup-message-input');
            msgInput.addEventListener('input', () => {
                if(msgInput.value.trim().length > 0) msgInput.classList.add('success');
                else msgInput.classList.remove('success');
            });
            // Activar si ya hay texto por defecto
            if(msgInput.value.trim().length > 0) msgInput.classList.add('success');

            // --- FUNCIÓN DE COMPRESIÓN DE IMAGEN ---
            const compress = (file) => new Promise(res => {
                const r = new FileReader(); r.readAsDataURL(file);
                r.onload = e => {
                    const i = new Image(); i.src = e.target.result;
                    i.onload = () => {
                        const c = document.createElement('canvas');
                        // Reducimos la imagen a máximo 800px para ahorrar espacio
                        const s = Math.min(1, 800/i.width); 
                        c.width = i.width*s; c.height = i.height*s;
                        c.getContext('2d').drawImage(i,0,0,c.width,c.height);
                        // Exportamos como JPEG calidad media (0.6)
                        res(c.toDataURL('image/jpeg', 0.6));
                    }
                }
            });

            const read = (file) => new Promise(res => {
                const r = new FileReader(); r.onload = e => res(e.target.result); r.readAsDataURL(file);
            });

            document.getElementById('inp-img').addEventListener('change', async e => {
                if(!e.target.files[0]) return;
                document.getElementById('txt-img').innerText = "Procesando...";
                
                // Usamos la compresión
                tempImg = await compress(e.target.files[0]);
                
                // -- FEEDBACK VERDE FOTO --
                document.getElementById('lbl-img').classList.add('success');
                document.getElementById('txt-img').innerText = "¡Foto Lista! ✅";
                
                iReady = true; check();
            });

            document.getElementById('inp-audio').addEventListener('change', async e => {
                if(!e.target.files[0]) return;
                document.getElementById('txt-audio').innerText = "Cargando...";
                tempAud = await read(e.target.files[0]);
                
                // -- FEEDBACK VERDE AUDIO --
                document.getElementById('lbl-audio').classList.add('success');
                document.getElementById('txt-audio').innerText = "¡Música Lista! ✅";
                
                aReady = true; check();
            });

            function check() { 
                if(iReady && aReady) {
                    const btn = document.getElementById('start-btn');
                    btn.classList.add('active'); // Activar botón
                }
            }

            document.getElementById('start-btn').addEventListener('click', () => {
                if(!iReady || !aReady) return;
                SAVE_IMG = tempImg;
                SAVE_AUD = tempAud;
                SAVE_MSG = msgInput.value.replace(/\n/g, '<br>');

                document.getElementById('setup-ui').style.display = 'none';
                document.getElementById('hint').style.display = 'block';
                document.getElementById('player').style.display = 'flex';
                document.getElementById('btn-download').style.display = 'block';

                const audio = document.getElementById('audio');
                audio.src = SAVE_AUD;
                audio.play();
                msgText.innerHTML = SAVE_MSG;
                initImage(SAVE_IMG);
            });
        }

        // --- SISTEMA DE DESCARGA INFALIBLE ---
        document.getElementById('btn-download').addEventListener('click', () => {
            const html = document.documentElement.outerHTML;
            // Reemplazo EXACTO de los marcadores 
            const finalHtml = html
                .replace('"___IMG___"', `"${SAVE_IMG}"`)
                .replace('"___AUD___"', `"${SAVE_AUD}"`)
                .replace('"___MSG___"', `"${SAVE_MSG}"`)
                .replace('id="btn-download"', 'id="btn-download" style="display:none"');

            const blob = new Blob([finalHtml], {type: 'text/html'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'Regalo_Magico.html';
            link.click();
        });

        const ae = document.getElementById('audio'), pb = document.getElementById('play-btn'), pr = document.getElementById('progress');
        pb.addEventListener('click', () => { if(ae.paused){ae.play();pb.innerText="⏸"}else{ae.pause();pb.innerText="▶"} });
        ae.addEventListener('timeupdate', () => { if(ae.duration) pr.style.width = (ae.currentTime/ae.duration)*100+"%"; });
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    </script>
</body>
</html>
